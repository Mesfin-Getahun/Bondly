name: bondly
description: "Bondly — A cross-platform app for nurturing meaningful friendships."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # Navigation
  go_router: ^14.8.1

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Dependency Injection
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Firebase
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_storage: ^14.0.1
  # firebase_messaging: re-add after resolving version compatibility with cloud_firestore ^7.1.0

  # Networking & Storage
  http: ^1.2.0
  shared_preferences: ^2.3.3

  # Media
  file_picker: ^8.1.0
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Utilities
  equatable: ^2.0.7
  dartz: ^0.10.1
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.2
  injectable_generator: ^2.7.0

flutter:
  uses-material-design: true
